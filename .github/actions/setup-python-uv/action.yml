name: Setup Python + uv
description: Install uv, a managed Python version, and project dependencies with uv cache

inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.12"
  extras:
    description: Comma-separated extras to install (e.g. "client" or "server,otel")
    required: true
runs:
  using: composite
  steps:
    - name: Restore uv cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}

    - name: Install uv
      shell: bash
      run: |
        curl --fail --location --silent --show-error https://astral.sh/uv/install.sh |
          env UV_UNMANAGED_INSTALL="$RUNNER_TEMP/uv-bin" sh
        echo "$RUNNER_TEMP/uv-bin" >> "$GITHUB_PATH"

    - name: Sync project dependencies
      shell: bash
      run: |
        uv python install ${{ inputs.python-version }}
        sync_args=(--group dev)
        IFS=',' read -ra extras <<< "${{ inputs.extras }}"
        for extra in "${extras[@]}"; do
          sync_args+=(--extra "$extra")
        done
        uv sync --locked --python ${{ inputs.python-version }} "${sync_args[@]}"
        echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
