# Workflow for validating container image builds
name: Validate Container Images

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "src/**"
      - ".dockerignore"
      - ".python-version"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/image_smoke.yml"

  # Allows running this workflow manually
  workflow_dispatch:

concurrency:
  group: image-smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Build and test all container images with optimized caching
  image-build-test:
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        build:
          - name: aio
            dockerfile: src/Dockerfile
            components: "client server"
          - name: client
            dockerfile: src/client/Dockerfile
            components: "client"
          - name: server
            dockerfile: src/server/Dockerfile
            components: "server"

    name: Build & Test - ${{ matrix.build.name }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Per-image GHA cache scope. The BuildKit GHA cache index is mutable per
      # scope, so concurrent matrix writers to a shared scope would race and the
      # last manifest would win, orphaning the other images' image-specific
      # layers. Keeping scopes distinct preserves each image's steady-state
      # warm-cache hits. security_scan.yml uses the same `aio-image` scope to
      # share layers with the aio build here.
      - name: Build Container Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.build.dockerfile }}
          tags: ${{ matrix.build.name }}:${{ github.sha }}
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.build.name }}-image
          cache-to: type=gha,mode=max,scope=${{ matrix.build.name }}-image,compression=zstd

      - name: Smoke Test - ${{ matrix.build.name }} Container
        env:
          IMAGE: ${{ matrix.build.name }}:${{ github.sha }}
          COMPONENTS: ${{ matrix.build.components }}
        run: |
          DB_NAME="test-${{ matrix.build.name }}-oracle"
          DB_NETWORK="test-${{ matrix.build.name }}-network"
          DB_USERNAME="SMOKE"
          DB_PASSWORD="OrA_41_3xPl0d3r"

          fail() {
            echo "❌ $NAME: $1"
            docker logs "$NAME" 2>&1 || true
            exit 1
          }

          fail_database() {
            echo "❌ $DB_NAME: $1"
            docker logs "$DB_NAME" 2>&1 || true
            exit 1
          }

          is_running() {
            [ "$(docker inspect --format '{{.State.Running}}' "$NAME")" = true ]
          }

          start_database() {
            docker run -d --name "$DB_NAME" \
              --network "$DB_NETWORK" \
              --network-alias core-db \
              -e ORACLE_PWD="$DB_PASSWORD" \
              -e ORACLE_PDB=FREEPDB1 \
              container-registry.oracle.com/database/free:latest-lite

            DEADLINE=$((SECONDS + 300))
            while (( SECONDS < DEADLINE )); do
              if [ "$(docker inspect --format '{{.State.Running}}' "$DB_NAME")" != true ]; then
                fail_database "container exited during startup"
              fi
              if docker logs "$DB_NAME" 2>&1 | grep -q "DATABASE IS READY TO USE!"; then
                break
              fi
              sleep 5
            done
            if ! docker logs "$DB_NAME" 2>&1 | grep -q "DATABASE IS READY TO USE!"; then
              fail_database "database did not become ready within 300 seconds"
            fi

            docker exec -i "$DB_NAME" sqlplus -s / as sysdba <<'SQL'
          WHENEVER SQLERROR EXIT SQL.SQLCODE
          ALTER SESSION SET CONTAINER=FREEPDB1;
          CREATE TABLESPACE IF NOT EXISTS USERS DATAFILE '/opt/oracle/oradata/FREE/FREEPDB1/users_01.dbf' SIZE 100M;
          CREATE USER IF NOT EXISTS SMOKE IDENTIFIED BY OrA_41_3xPl0d3r
            DEFAULT TABLESPACE USERS
            TEMPORARY TABLESPACE TEMP;
          GRANT DB_DEVELOPER_ROLE TO SMOKE;
          ALTER USER SMOKE DEFAULT ROLE ALL;
          ALTER USER SMOKE QUOTA UNLIMITED ON USERS;
          EXIT;
          SQL
          }

          docker network create "$DB_NETWORK"
          for COMPONENT in $COMPONENTS; do
            NAME="test-${{ matrix.build.name }}-$COMPONENT"
            case "$COMPONENT" in
              client) PORT=8501; PROBE=/_stcore/health ;;
              server)
                PORT=8000
                PROBE=/v1/liveness
                start_database
                ;;
              *) fail "unknown component: $COMPONENT" ;;
            esac
            echo "Testing $IMAGE in $COMPONENT mode..."

            DATABASE_ENV=()
            if [ "$COMPONENT" = server ]; then
              DATABASE_ENV=(
                -e "AIO_DB_USERNAME=$DB_USERNAME"
                -e "AIO_DB_PASSWORD=$DB_PASSWORD"
                -e AIO_DB_DSN=core-db:1521/FREEPDB1
              )
            fi
            docker run -d --name "$NAME" \
              --network "$DB_NETWORK" \
              -p "127.0.0.1::$PORT" \
              -e AIO_API_KEY=test-key-for-ci \
              "${DATABASE_ENV[@]}" \
              "$IMAGE" "$COMPONENT"
            URL="http://$(docker port "$NAME" "$PORT/tcp")$PROBE"

            READY=false
            DEADLINE=$((SECONDS + 180))
            while (( SECONDS < DEADLINE )); do
              is_running || fail "container exited during startup"
              if curl --fail --silent --max-time 2 "$URL" >/dev/null; then
                READY=true
                break
              fi
              sleep 1
            done
            if [ "$READY" != true ]; then
              fail "$URL did not become ready within 180 seconds"
            fi

            # Require ten healthy seconds after application startup completes.
            for _ in $(seq 1 10); do
              sleep 1
              is_running || fail "container exited after becoming ready"
              curl --fail --silent --max-time 2 "$URL" >/dev/null || fail "$URL became unhealthy"
            done
            echo "✅ $NAME completed startup and remained healthy"
            docker stop "$NAME"
          done

      - name: Cleanup Test Container
        if: always()
        run: |
          for COMPONENT in ${{ matrix.build.components }}; do
            NAME="test-${{ matrix.build.name }}-$COMPONENT"
            docker stop "$NAME" 2>/dev/null || true
            docker rm "$NAME" 2>/dev/null || true
          done
          docker rm --force "test-${{ matrix.build.name }}-oracle" 2>/dev/null || true
          docker network rm "test-${{ matrix.build.name }}-network" 2>/dev/null || true

  # Summary job
  image-validation-summary:
    name: Validation Summary
    if: always() && (github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions: {}
    needs: [image-build-test]

    steps:
      - name: Evaluate results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ One or more image validations failed"
            exit 1
          fi
          echo "✅ All container image validations passed"
