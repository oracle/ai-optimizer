# Security scanning for container image vulnerabilities and GitHub Actions integrity
name: Security Scan

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "pyproject.toml"
      - "src/Dockerfile"
      - ".github/workflows/**"

  schedule:
    # Daily security scan at 06:00 UTC
    - cron: "0 6 * * *"

  # Allows running this workflow manually
  workflow_dispatch:

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Trivy security scan
  trivy-scan:
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Shared cache scope with image_smoke.yml's aio build so PR runs reuse
      # layers across workflows. Scheduled runs still pay a cold cache.
      - name: Build AIO Container Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src/Dockerfile
          tags: aio:${{ github.sha }}
          load: true
          push: false
          cache-from: type=gha,scope=aio-image
          cache-to: type=gha,mode=max,scope=aio-image,compression=zstd

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          cache: true

      - name: Prepare Trivy Cache Directory
        run: |
          mkdir -p "${{ github.workspace }}/.trivy-cache"
          sudo chown -R "$(id -u):$(id -g)" "${{ github.workspace }}/.trivy-cache"

      - name: Get Date
        id: date
        run: echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.trivy-cache
          key: trivy-db-${{ steps.date.outputs.today }}
          restore-keys: |
            trivy-db-

      # The first scan logs HIGH+CRITICAL findings; the second produces the
      # CRITICAL-only SARIF report uploaded to the Security tab.
      #
      # Skips ibm_watsonx_ai/connections.py: docstring shows a Google BigQuery
      # service-account JSON example with placeholder values, which Trivy's
      # secret scanner flags as a GCP service-account credential.
      - name: Log HIGH+CRITICAL Findings
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: aio:${{ github.sha }}
          severity: HIGH,CRITICAL
          format: table
          ignore-unfixed: true
          skip-files: "**/ibm_watsonx_ai/connections.py"
          docker-host: unix:///var/run/docker.sock
          exit-code: '0'
          cache: false
          cache-dir: ${{ github.workspace }}/.trivy-cache
          skip-setup-trivy: true

      - name: Generate CRITICAL-only SARIF (fails build on CRITICAL)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: aio:${{ github.sha }}
          severity: CRITICAL
          format: sarif
          output: trivy-results.sarif
          limit-severities-for-sarif: true
          ignore-unfixed: true
          skip-files: "**/ibm_watsonx_ai/connections.py"
          docker-host: unix:///var/run/docker.sock
          exit-code: '1'
          cache: false
          cache-dir: ${{ github.workspace }}/.trivy-cache
          skip-setup-trivy: true

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-results.sarif
          category: trivy-aio

  # Macaron - check GitHub Actions for known vulnerabilities
  macaron:
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Macaron Security Analysis
        uses: oracle/macaron@794eec32782979f577efb5ff71d585f683a3550f # v0.25.0
        with:
          repo_path: "https://github.com/${{ github.repository }}"
          branch: ${{ github.head_ref || github.ref_name }}
          digest: ${{ github.event.pull_request.head.sha || github.sha }}
          policy_file: check-github-actions
          policy_purl: "pkg:github.com/${{ github.repository }}@.*"
          reports_retention_days: 90
