# Workflow for validating and deploying documentation and Helm charts to Pages.
name: Deploy Documentation/Helm to Pages

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/documentation.yml"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "helm/**"
      - ".github/workflows/documentation.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541d0c95d3a131d51358d6f7cc3081 # v4.0.3
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/public/package-lock.json

      - name: Install documentation dependencies
        run: npm ci --prefix docs/public

      - name: Build documentation
        run: npm run build --prefix docs/public

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541d0c95d3a131d51358d6f7cc3081 # v4.0.3
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/public/package-lock.json

      - name: Install documentation dependencies
        run: npm ci --prefix docs/public

      - name: Build documentation
        run: npm run build --prefix docs/public

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: ./.github/actions/setup-helm

      - name: Register Helm subchart repositories
        run: helm repo add --force-update signoz https://charts.signoz.io

      - name: Package tagged Helm charts
        run: |
          mkdir -p docs/public/build/helm
          TAGS=$(git tag --sort=creatordate)
          for TAG in $TAGS; do
            if [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              VERSION=${TAG#v}
              WORKDIR=$(mktemp -d)
              git worktree add "$WORKDIR" "$TAG"
              if grep -q "^dependencies:" "$WORKDIR/helm/Chart.yaml"; then
                helm dependency build "$WORKDIR/helm"
              fi
              helm package "$WORKDIR/helm" \
                -d docs/public/build/helm \
                --version "$VERSION" \
                --app-version "$VERSION" \
                --debug
              git worktree remove --force "$WORKDIR"
            fi
          done

      - name: Package main Helm chart
        run: |
          helm dependency build helm
          helm package helm -d docs/public/build/helm --debug

      - name: Index Helm charts
        run: helm repo index docs/public/build/helm --url "${{ steps.pages.outputs.base_url }}/helm"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./docs/public/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
