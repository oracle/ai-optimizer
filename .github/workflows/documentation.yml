# Workflow for validating and deploying documentation and Helm charts to Pages.
name: Deploy Documentation/Helm to Pages

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/documentation.yml"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "helm/**"
      - ".github/workflows/documentation.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install documentation dependencies
        run: npm ci --prefix docs

      - name: Build documentation
        run: npm run build --prefix docs

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install documentation dependencies
        run: npm ci --prefix docs

      - name: Prepare versioned documentation
        run: |
          set -euo pipefail

          VERSIONED_DOCS=docs/versioned_docs
          VERSIONED_SIDEBARS=docs/versioned_sidebars
          rm -rf "$VERSIONED_DOCS" "$VERSIONED_SIDEBARS"
          mkdir -p "$VERSIONED_DOCS" "$VERSIONED_SIDEBARS"

          RELEASE_TAGS=()
          while IFS= read -r TAG; do
            VERSION=${TAG#v}
            IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
            if ((MAJOR > 2 || (MAJOR == 2 && MINOR >= 4))); then
              RELEASE_TAGS+=("$TAG")
            fi
          done < <(
            git tag --list | \
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | \
              sort -V -r
          )

          if ((${#RELEASE_TAGS[@]} == 0)); then
            echo 'No release tags found; publishing only v0.0.0 from main.'
            printf '[]\n' > docs/versions.json
            exit 0
          fi

          LATEST_TAG=${RELEASE_TAGS[0]}
          LATEST_MINOR=${LATEST_TAG%.*}
          PREVIOUS_MINOR=''
          SELECTED_TAGS=()

          for TAG in "${RELEASE_TAGS[@]}"; do
            TAG_MINOR=${TAG%.*}
            if [[ $TAG_MINOR == "$LATEST_MINOR" ]]; then
              SELECTED_TAGS+=("$TAG")
            elif [[ -z $PREVIOUS_MINOR ]]; then
              PREVIOUS_MINOR=$TAG_MINOR
              SELECTED_TAGS+=("$TAG")
            elif [[ $TAG_MINOR == "$PREVIOUS_MINOR" ]]; then
              # Tags are newest-first, so the first tag is the final patch release.
              continue
            else
              break
            fi
          done

          printf '[\n' > docs/versions.json
          for INDEX in "${!SELECTED_TAGS[@]}"; do
            TAG=${SELECTED_TAGS[$INDEX]}
            COMMA=','
            if ((INDEX == ${#SELECTED_TAGS[@]} - 1)); then
              COMMA=''
            fi
            printf '  "%s"%s\n' "$TAG" "$COMMA" >> docs/versions.json

            VERSION_DIRECTORY="$VERSIONED_DOCS/version-$TAG"
            mkdir -p "$VERSION_DIRECTORY"
            git archive "$TAG" docs/content | \
              tar --extract --file - --directory "$VERSION_DIRECTORY" --strip-components=2
            printf '{"tutorialSidebar":[{"type":"autogenerated","dirName":"."}]}' \
              > "$VERSIONED_SIDEBARS/version-$TAG-sidebars.json"
          done
          printf ']\n' >> docs/versions.json

          echo 'Publishing documentation versions:'
          cat docs/versions.json

      - name: Build documentation
        run: npm run build --prefix docs

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: ./.github/actions/setup-helm

      - name: Register Helm subchart repositories
        run: helm repo add --force-update signoz https://charts.signoz.io

      - name: Package tagged Helm charts
        run: |
          mkdir -p docs/build/helm
          TAGS=$(git tag --sort=creatordate)
          for TAG in $TAGS; do
            if [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              VERSION=${TAG#v}
              WORKDIR=$(mktemp -d)
              git worktree add "$WORKDIR" "$TAG"
              if grep -q "^dependencies:" "$WORKDIR/helm/Chart.yaml"; then
                helm dependency build "$WORKDIR/helm"
              fi
              helm package "$WORKDIR/helm" \
                -d docs/build/helm \
                --version "$VERSION" \
                --app-version "$VERSION" \
                --debug
              git worktree remove --force "$WORKDIR"
            fi
          done

      - name: Package main Helm chart
        run: |
          helm dependency build helm
          helm package helm -d docs/build/helm --debug

      - name: Index Helm charts
        run: helm repo index docs/build/helm --url "${{ steps.pages.outputs.base_url }}/helm"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./docs/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
