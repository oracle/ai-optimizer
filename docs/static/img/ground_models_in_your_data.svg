<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title>Ground Models in Your Data</title>
  <desc>Minimal illustration showing structured and unstructured data feeding into model grounding.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f9fc"/>
      <stop offset="100%" stop-color="#eef3f9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7fcbff"/>
      <stop offset="100%" stop-color="#5f8cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1f2a44" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="800" rx="48" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="420" y="250" width="360" height="230" rx="36" fill="#ffffff"/>
    <rect x="460" y="296" width="280" height="24" rx="12" fill="#dbe5f2"/>
    <rect x="460" y="336" width="220" height="24" rx="12" fill="#dbe5f2"/>
    <rect x="460" y="376" width="250" height="24" rx="12" fill="#dbe5f2"/>
    <circle cx="600" cy="242" r="72" fill="#1f2a44"/>
    <path d="M564 242h72" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
    <path d="M600 206v72" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
    <circle cx="600" cy="242" r="26" fill="url(#accent)"/>
  </g>

  <g>
    <rect x="110" y="230" width="210" height="340" rx="30" fill="#ffffff" stroke="#dbe5f2" stroke-width="2"/>
    <rect x="140" y="262" width="150" height="18" rx="9" fill="#dbe5f2"/>
    <g transform="translate(140 312)">
      <rect width="150" height="34" rx="10" fill="#f5f8fc" stroke="#dbe5f2" stroke-width="2"/>
      <rect y="50" width="150" height="34" rx="10" fill="#f5f8fc" stroke="#dbe5f2" stroke-width="2"/>
      <rect y="100" width="150" height="34" rx="10" fill="#f5f8fc" stroke="#dbe5f2" stroke-width="2"/>
      <rect y="150" width="150" height="34" rx="10" fill="#f5f8fc" stroke="#dbe5f2" stroke-width="2"/>
    </g>
    <circle cx="255" cy="500" r="20" fill="#5f8cff"/>
  </g>

  <g>
    <rect x="870" y="230" width="210" height="340" rx="30" fill="#ffffff" stroke="#dbe5f2" stroke-width="2"/>
    <rect x="905" y="265" width="140" height="140" rx="18" fill="#f5f8fc" stroke="#dbe5f2" stroke-width="2"/>
    <path d="M927 368l30-34 24 24 24-28 24 38" fill="none" stroke="#5f8cff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="980" cy="500" r="20" fill="#5f8cff"/>
    <path d="M980 402v78" stroke="#8ca3bf" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g>
    <path d="M320 401H420" stroke="#8ca3bf" stroke-width="8" stroke-linecap="round"/>
    <path d="M780 401H870" stroke="#8ca3bf" stroke-width="8" stroke-linecap="round"/>
    <path d="M420 401c36 0 44-40 78-40s42 40 78 40" fill="none" stroke="#5f8cff" stroke-width="8" stroke-linecap="round"/>
    <path d="M780 401c-36 0-44-40-78-40s-42 40-78 40" fill="none" stroke="#5f8cff" stroke-width="8" stroke-linecap="round"/>
  </g>

  <text x="600" y="650" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" fill="#1f2a44">Structured and unstructured data, grounded together</text>
</svg>
