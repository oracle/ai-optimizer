# Horizontal autoscaling and resource configuration for a production release.
server:
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 2000m
      memory: 4Gi

client:
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
