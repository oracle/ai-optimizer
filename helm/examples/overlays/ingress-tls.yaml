# TLS ingress overlay. Create ai-optimizer-tls before installing and replace
# the example hostnames for your environment.
server:
  ingress:
    enabled: true
    className: nginx
    tls:
      - hosts:
          - api.example.com
        secretName: ai-optimizer-tls

client:
  ingress:
    enabled: true
    className: nginx
    tls:
      - hosts:
          - app.example.com
        secretName: ai-optimizer-tls
