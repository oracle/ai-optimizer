{{- $oidc := .Values.server.devOidc -}}
{{- if and .Values.client.enabled $oidc.enabled -}}
{{- $secretName := printf "%s-client-oidc" (include "ai-optimizer.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $cookieSecret := "" -}}
{{- $webClientSecret := "" -}}
{{- if and $existing $existing.data (hasKey $existing.data "cookieSecret") -}}
{{- $cookieSecret = index $existing.data "cookieSecret" | b64dec -}}
{{- else -}}
{{- $cookieSecret = randAlphaNum 64 -}}
{{- end -}}
{{- if and $existing $existing.data (hasKey $existing.data "webClientSecret") -}}
{{- $webClientSecret = index $existing.data "webClientSecret" | b64dec -}}
{{- else -}}
{{- $webClientSecret = randAlphaNum 64 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    app.kubernetes.io/component: client
    {{- include "ai-optimizer.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  cookieSecret: {{ $cookieSecret | quote }}
  webClientSecret: {{ $webClientSecret | quote }}
  secrets.toml: |
{{- include "ai-optimizer.client.oidcSecretsToml" (dict "oidc" $oidc "cookieSecret" $cookieSecret "webClientSecret" $webClientSecret) | nindent 4 }}
{{- end }}
