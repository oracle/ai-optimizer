{{- if .Values.client.enabled }}
{{ include "ai-optimizer.client.cookieBothSet.fail" . }}

{{- $cookieSecret := .Values.client.cookieSecret | trim }}
{{- $externalName := .Values.client.cookieSecretName | trim }}
{{- if not $externalName }}
{{- $secretName := include "ai-optimizer.client.cookieSecretName" . }}
{{- $secretKey := include "ai-optimizer.client.cookieSecretKey" . }}
{{- $encodedSecret := "" }}
{{- if $cookieSecret }}
  {{- $encodedSecret = $cookieSecret | b64enc }}
{{- else }}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
  {{- if and $existing $existing.data (hasKey $existing.data $secretKey) }}
    {{- $encodedSecret = index $existing.data $secretKey }}
  {{- else }}
    {{- $encodedSecret = randAlphaNum 32 | b64enc }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    app.kubernetes.io/component: client
    {{- include "ai-optimizer.labels" . | nindent 4 }}
type: Opaque
data:
  "{{ $secretKey }}": {{ $encodedSecret | quote }}
{{- end }}
{{- end }}
