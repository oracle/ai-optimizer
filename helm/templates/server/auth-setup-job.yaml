{{- include "ai-optimizer.server.database.required" . }}
{{- include "ai-optimizer.authentication.validate" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ai-optimizer.fullname" . }}-auth-setup-{{ .Release.Revision }}
  labels:
    app.kubernetes.io/component: auth-setup
    {{- include "ai-optimizer.labels" . | nindent 4 }}
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: auth-setup
        {{- include "ai-optimizer.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- include "ai-optimizer.imagePullSecrets" (dict "local" .Values.server.imagePullSecrets "global" .Values.global.imagePullSecrets) | nindent 6 }}
      containers:
        - name: auth-setup
          image: {{ include "ai-optimizer.image" (dict "image" .Values.server.image "global" .Values.global "appVersion" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.server.image.pullPolicy | default "IfNotPresent" }}
          command: ["python", "-m", "server.app.auth.setup"]
          args: ["--wait-seconds", "900"]
          env:
            - name: AIO_ENV
              value: {{ .Values.global.env | quote }}
            - name: AIO_AUTH_SETUP_PRIV_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-optimizer.server.databasePrivSecret" . }}
                  key: {{ default "username" .Values.server.database.privAuthn.usernameKey }}
                  optional: true
            - name: AIO_AUTH_SETUP_PRIV_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-optimizer.server.databasePrivSecret" . }}
                  key: {{ default "password" .Values.server.database.privAuthn.passwordKey }}
                  optional: true
            {{- include "ai-optimizer.server.database.authn" . | nindent 12 }}
            {{- if eq (include "ai-optimizer.server.database.isADBS" .) "true" }}
            - name: AIO_DB_WALLET_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-optimizer.server.database.adbWalletPassSecret" . }}
                  key: {{ include "ai-optimizer.server.database.adbWalletPassSecretKey" . }}
            {{- end }}
          volumeMounts:
            - name: env-config
              mountPath: /app/src/.env.{{ .Values.global.env }}
              subPath: {{ include "ai-optimizer.server.envSecretKey" . }}
              readOnly: true
            {{- if eq (include "ai-optimizer.server.database.isADBS" .) "true" }}
            - name: tns-admin
              mountPath: /app/tns_admin
              readOnly: true
            {{- end }}
      volumes:
        - name: env-config
          secret:
            secretName: {{ include "ai-optimizer.server.envSecretName" . }}
        {{- if eq (include "ai-optimizer.server.database.isADBS" .) "true" }}
        - name: tns-admin
          secret:
            secretName: {{ include "ai-optimizer.server.database.adbTnsAdminSecret" . }}
        {{- end }}
