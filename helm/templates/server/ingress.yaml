{{- if .Values.server.ingress.enabled -}}
{{- $annotations := deepCopy (.Values.server.ingress.annotations | default dict) -}}
{{- if and .Values.server.ssl.enabled (eq .Values.server.ingress.className "nginx") (not (hasKey $annotations "nginx.ingress.kubernetes.io/backend-protocol")) -}}
  {{- $_ := set $annotations "nginx.ingress.kubernetes.io/backend-protocol" "HTTPS" -}}
{{- end -}}
{{- if and (eq .Values.server.ingress.className "native-ic") (not (hasKey $annotations "oci-native-ingress.oraclecloud.com/backend-tls-enabled")) -}}
  {{- $_ := set $annotations "oci-native-ingress.oraclecloud.com/backend-tls-enabled" (ternary "true" "false" .Values.server.ssl.enabled) -}}
{{- end -}}
{{- if and .Values.server.ingress.className (not (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion)) }}
  {{- if not (hasKey $annotations "kubernetes.io/ingress.class") }}
  {{- $_ := set $annotations "kubernetes.io/ingress.class" .Values.server.ingress.className}}
  {{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ai-optimizer.server.serviceName" . }}
  labels:
    app.kubernetes.io/component: server
    {{- include "ai-optimizer.labels" . | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if and .Values.server.ingress.className (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion) }}
  ingressClassName: {{ .Values.server.ingress.className }}
  {{- end }}
  {{- if .Values.server.ingress.tls }}
  tls:
    {{- range .Values.server.ingress.tls }}
    - secretName: {{ .secretName }}
      {{- with .hosts }}
      hosts:
        {{- range . }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}
    {{- end }}
  {{- end }}
  rules:
    {{- if .Values.server.ingress.host }}
    - host: {{ .Values.server.ingress.host | quote }}
      http:
    {{- else }}
    - http:
    {{- end }}
        paths:
          - pathType: Prefix
            path: {{ include "ai-optimizer.getPath" . }}v1
            backend:
              {{- if semverCompare ">=1.19-0" $.Capabilities.KubeVersion.GitVersion }}
              service:
                name: {{ include "ai-optimizer.server.serviceName" . }}
                port:
                  number: {{ .Values.server.service.port | default 8000 }}
              {{- else }}
              serviceName: {{ include "ai-optimizer.server.serviceName" . }}
              servicePort: {{ .Values.server.service.port | default 8000 }}
              {{- end }}
{{- end }}
