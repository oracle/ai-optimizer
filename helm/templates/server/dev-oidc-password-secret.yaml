{{- if and .Values.server.auth.enabled (eq .Values.server.auth.mode "local") .Values.server.auth.passwordAutoGenerate }}
{{- $secretName := include "ai-optimizer.server.auth.passwordSecretName" . }}
{{- $secretKey := include "ai-optimizer.server.auth.passwordSecretKey" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $password := "" }}
{{- if and $existing $existing.data (hasKey $existing.data $secretKey) }}
  {{- $password = index $existing.data $secretKey | b64dec }}
{{- else }}
  {{- $password = include "ai-optimizer.server.randomPassword" . | trim }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    app.kubernetes.io/component: server
    {{- include "ai-optimizer.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ $secretKey }}: {{ $password | quote }}
{{- end }}
